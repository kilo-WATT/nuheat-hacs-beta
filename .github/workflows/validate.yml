name: Validate unpublished NuHeat candidate
on:
  push:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.2'
      # Build from the reviewed SDK source until 0.1.5 is available on PyPI.
      - name: Install the exact unpublished SDK candidate
        run: python -m pip install "chemelex-nuheat @ https://github.com/kilo-WATT/chemelex-nuheat/archive/0c006cdd5ced9a71b4009c413c917aa6e2d94913.tar.gz"
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q
      - run: ruff check custom_components tests tools
      - run: python tools/package.py
      # No release, upload, push or publication steps are permitted here.
