name: Validate unpublished NuHeat candidate
on:
  push:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.2'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q
      - name: Verify the pinned official native climate API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python tools/verify_native_climate.py -q
          tests/nuheat/test_native_temperature.py
          tests/nuheat/test_automation_compatibility.py
          tests/nuheat/test_hold_action.py
          tests/nuheat/test_mode_reconciliation.py
          tests/nuheat/test_setpoint_reconciliation.py
          tests/nuheat/test_api_resilience.py
      - run: ruff check custom_components tests tools
      - run: python tools/package.py
      # No release, upload, push or publication steps are permitted here.
